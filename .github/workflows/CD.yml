name: 'CD_workflow'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: 'terraform'
    runs-on: ubuntu-latest
    outputs:
      s3_dev_bucket_name: ${{ steps.Get_Terraform_Output.outputs.bucket_name }}
      cognito_region: ${{ steps.Get_Terraform_Output.outputs.cognito_region }}
      cognito_user_pool_id: ${{ steps.Get_Terraform_Output.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.Get_Terraform_Output.outputs.cognito_client_id }}
    environment: production
    env:
      TF_VAR_bucket_prefix: ${{ vars.AWS_BUCKET_NAME }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash
        working-directory: .terraform

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Configure AWS Credentials to access S3 backend and resources
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: eu-north-1

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      run: terraform apply -auto-approve -input=false

    - name: Get Terraform Output
      id: Get_Terraform_Output
      run: |
        echo "bucket_name=$(terraform output -raw s3_dev_bucket_name)" >> $GITHUB_OUTPUT
        echo "cognito_region=$(terraform output -raw cognito_region)" >> $GITHUB_OUTPUT
        echo "cognito_user_pool_id=$(terraform output -raw cognito_user_pool_id)" >> $GITHUB_OUTPUT
        echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> $GITHUB_OUTPUT
        echo "API:    $(terraform output -raw api_base_url)slots"

  deploy:
    needs: terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Cognito auth config
        run: |
          cat > web/public/auth-config.js <<EOF
          window.AUTH_CONFIG = {
            region: "${{ needs.terraform.outputs.cognito_region }}",
            userPoolId: "${{ needs.terraform.outputs.cognito_user_pool_id }}",
            clientId: "${{ needs.terraform.outputs.cognito_client_id }}",
          };
          EOF

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - uses: jakejarvis/s3-sync-action@master
        with:
          args: --follow-symlinks --delete --exclude '.git/*' --exclude '.gitignore' --exclude '.github/*' --exclude 'LICENSE.md' --exclude 'README.md' --exclude '.terraform/*'
        env:
          AWS_S3_BUCKET: ${{ needs.terraform.outputs.s3_dev_bucket_name }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: 'eu-north-1'
          SOURCE_DIR: 'web/public'